<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hit Padel — Torneio Americano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* cores extraídas do logo oficial Hit Padel Tuparendi */
    --navy:#072740;
    --navy-deep:#041A2C;
    --orange:#F66B0D;
    --yellow:#E0D73A;
    --blue:#0B6DB5;
    --chalk:#F6F3EA;
    --line: rgba(246,243,234,0.14);
  }
  *{box-sizing:border-box;}
  input, select, textarea{font-size:16px;}
  body{margin:0;background:var(--navy-deep);color:var(--chalk);font-family:'Inter',sans-serif;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;}

  .hp-header{background:var(--navy);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .hp-header-inner{max-width:720px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .hp-brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .hp-logo{height:34px;width:auto;display:block;flex-shrink:0;}
  .hp-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--yellow);}
  .hp-name-input{font-family:'Bebas Neue',sans-serif;font-size:20px;background:transparent;color:var(--chalk);border:none;border-bottom:1px dashed var(--line);outline:none;width:100%;}
  .hp-live{font-size:11px;opacity:.7;display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hp-admin-btn{flex-shrink:0;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;background:transparent;color:var(--chalk);border:1px solid var(--line);cursor:pointer;}
  .hp-admin-btn.on{background:var(--orange);color:var(--navy-deep);border-color:var(--orange);}
  .hp-header-actions{display:flex;align-items:center;gap:8px;}
  .hp-back-btn{flex-shrink:0;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;background:transparent;color:var(--chalk);border:1px solid var(--line);cursor:pointer;}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dash-card{background:var(--navy-deep);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;color:var(--chalk);}
  .dash-title{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--orange);}
  .dash-sub{font-size:12px;opacity:.7;margin-top:4px;}
  .torneio-card{cursor:pointer;}
  .torneio-card:hover{border-color:var(--orange);}
  .torneio-card-acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .torneio-card-acoes .mode-btn{flex:1;min-width:0;padding:8px 6px;font-size:12px;}
  .btn-danger{background:transparent;border-color:#8a3a3a !important;color:#ff9b9b !important;}
  .btn-danger:hover{background:#3a1a1a;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;cursor:pointer;}
  .checkbox-row input{width:auto;}
  .visaogeral-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;}
  .visaogeral-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--yellow);}
  .visaogeral-label{font-size:11px;opacity:.7;}
  .aovivo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .aovivo-card{background:var(--navy-deep);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .aovivo-card.aovivo-andamento{border-color:#3aa35a;}
  .aovivo-card.aovivo-proxima{border-color:#c9a227;}
  .aovivo-card.aovivo-pendente{border-color:#b04545;}
  .aovivo-quadra{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--orange);}
  .aovivo-status{font-size:12px;margin-top:2px;}
  .aovivo-jogo{font-size:11px;opacity:.75;margin-top:6px;}
  .cta-card{border-color:var(--orange);}
  .proxima-banner{background:linear-gradient(135deg,var(--navy-deep),var(--navy));border:1px solid var(--orange);border-radius:14px;padding:14px 16px;margin-top:16px;text-align:center;}
  .proxima-banner-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.75;}
  .proxima-banner-info{font-size:13px;color:var(--yellow);font-weight:700;margin-top:4px;}
  .proxima-banner-jogo{font-family:'Bebas Neue',sans-serif;font-size:20px;margin-top:4px;}
  .proxima-banner .vs-inline{color:var(--orange);}
  .hp-main.hp-main-wide{max-width:1100px;}
  .lobby-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  .lobby-stats-grid .visaogeral-item{background:var(--navy-deep);border:1px solid var(--line);border-radius:12px;padding:12px 8px;}
  .lobby-grid-desktop{display:grid;grid-template-columns:1fr;gap:20px;margin-top:18px;}
  .lobby-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .lobby-filters input{flex:2;min-width:140px;}
  .lobby-filters select{flex:1;min-width:120px;}
  .lobby-table th, .lobby-table td{white-space:nowrap;}
  .lobby-row{cursor:pointer;}
  .lobby-row:hover{background:rgba(246,107,13,.08);}
  .lobby-acoes-cell{display:flex;gap:6px;}
  .lobby-acoes-cell .mode-btn{padding:6px 10px;font-size:11px;}
  .lobby-proxima-item{padding:10px 0;border-top:1px solid var(--line);cursor:pointer;}
  .lobby-proxima-item:first-child{border-top:none;padding-top:0;}
  .lobby-proxima-hora{font-size:11px;color:var(--yellow);font-weight:700;}
  .lobby-proxima-torneio{font-size:13px;font-weight:600;margin-top:2px;}
  .lobby-proxima-jogo{font-size:12px;opacity:.75;margin-top:2px;}
  @media (min-width:880px){
    .lobby-stats-grid{grid-template-columns:repeat(6,1fr);}
    .lobby-grid-desktop{grid-template-columns:2fr 1fr;align-items:start;}
  }

  .hp-main{max-width:720px;margin:0 auto;padding:0 16px 110px;}

  .card{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .card-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--navy);border:none;color:var(--chalk);padding:12px 16px;font-family:'Bebas Neue',sans-serif;font-size:18px;cursor:pointer;}
  .card-body{padding:16px;background:rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:14px;}
  .field label{display:block;font-size:12px;opacity:.6;margin-bottom:5px;}
  .field input, .card-body input{width:100%;padding:9px 12px;border-radius:10px;background:var(--navy-deep);border:1px solid var(--line);color:var(--chalk);outline:none;}
  .mode-row{display:flex;flex-wrap:wrap;gap:6px;}
  .mode-btn{flex:1;min-width:100px;padding:9px 8px;border-radius:10px;background:var(--navy-deep);border:1px solid var(--line);color:var(--chalk);font-size:12px;font-weight:600;cursor:pointer;}
  .mode-btn.active{background:var(--orange);color:var(--navy-deep);border-color:var(--orange);}
  .champion-banner{background:var(--yellow);color:var(--navy-deep);font-family:'Bebas Neue',sans-serif;font-size:20px;text-align:center;padding:10px;border-radius:12px;margin-bottom:14px;}
  .round-block.is-final .round-title{color:var(--yellow);}
  .bye-match{display:flex;align-items:center;justify-content:space-between;opacity:.75;}
  .bye-tag{font-size:11px;background:var(--blue);color:var(--chalk);padding:2px 8px;border-radius:999px;}
  .pending-match{opacity:.5;font-size:13px;display:flex;gap:6px;align-items:center;}
  .team-row.winner .team-name{color:var(--yellow);font-weight:700;}
  .chip em{opacity:.6;font-style:normal;font-size:11px;}
  .cat-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .sugg-chip{font-size:12px;padding:5px 10px;border-radius:999px;background:transparent;border:1px dashed var(--line);color:var(--chalk);cursor:pointer;}
  select{padding:9px 8px;border-radius:10px;background:var(--navy-deep);border:1px solid var(--line);color:var(--chalk);}
  .cat-tabs{margin-top:10px;}
  .groups-wrap{display:flex;flex-direction:column;gap:16px;}
  .signup-card{border-color:var(--orange);}
  .signup-ok{margin-top:8px;font-size:13px;color:var(--yellow);font-weight:600;}
  .chip .tel{opacity:.6;font-size:11px;}
  .card-head-static{background:var(--navy);padding:12px 16px;font-family:'Bebas Neue',sans-serif;font-size:18px;}
  .conf-badge{border:none;border-radius:999px;width:28px;height:28px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .conf-badge.yes{background:var(--yellow);color:var(--navy-deep);}
  .conf-badge.no{background:transparent;border:1px solid var(--line);color:var(--chalk);}
  .vis-badge{border:none;background:transparent;color:var(--chalk);opacity:.7;cursor:pointer;font-size:15px;padding:4px 6px;min-width:26px;min-height:26px;}
  .chip.is-oculto{opacity:.45;}
  .court-name-input{padding:9px 8px;}
  .jogo-hora{font-size:12px;color:var(--yellow);font-weight:700;}
  .badge-ok{font-size:11px;color:var(--yellow);margin-left:4px;}
  .badge-pending{font-size:11px;opacity:.6;margin-left:4px;}
  .search-field{margin:14px 0;}
  .search-field input{width:100%;}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .row input{flex:1;min-width:120px;}
  .row select{min-width:0;flex-shrink:1;}
  .row button, .row2{}
  .row > button{padding:0 16px;border-radius:10px;background:var(--orange);color:var(--navy-deep);border:none;font-weight:700;cursor:pointer;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .chip{display:flex;flex-wrap:wrap;align-items:center;gap:5px;background:var(--navy-deep);padding:6px 6px 6px 12px;border-radius:999px;font-size:13px;max-width:100%;}
  .chip button{background:none;border:none;color:var(--chalk);opacity:.6;cursor:pointer;font-size:15px;min-width:26px;min-height:26px;}
  .btn-primary{width:100%;padding:13px;border-radius:12px;border:none;background:var(--orange);color:var(--navy-deep);font-family:'Bebas Neue',sans-serif;font-size:18px;cursor:pointer;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .hint{font-size:13px;opacity:.6;text-align:center;}

  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;margin-bottom:12px;}
  .tab{padding:7px 16px;border-radius:999px;font-size:14px;font-weight:500;background:transparent;color:var(--chalk);border:1px solid var(--line);cursor:pointer;}
  .tab.active{background:var(--orange);color:var(--navy-deep);border-color:var(--orange);}

  .rounds{display:flex;flex-direction:column;gap:20px;}
  .round-title{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--yellow);}
  .bye{font-family:'Inter',sans-serif;font-size:12px;color:var(--chalk);opacity:.6;}
  .matches{display:grid;gap:8px;}
  .match{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--navy);}
  .match-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .court-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue);color:var(--chalk);}
  .check{color:var(--yellow);}
  .team-row{display:flex;align-items:center;gap:8px;font-size:14px;}
  .team-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .score{font-family:'Bebas Neue',sans-serif;font-size:22px;width:32px;text-align:center;}
  .score-input{width:56px;text-align:center;padding:5px;border-radius:8px;background:var(--navy-deep);border:1px solid var(--line);color:var(--chalk);}
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .vs{text-align:center;font-size:10px;opacity:.4;margin:2px 0;}
  .btn-save{margin-top:8px;width:100%;padding:8px;border-radius:10px;border:none;background:var(--orange);color:var(--navy-deep);font-weight:700;font-size:13px;cursor:pointer;}
  .saved-row{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .saved-tag{font-size:12px;font-weight:700;color:var(--yellow);}
  .btn-edit{padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--chalk);font-size:12px;cursor:pointer;}

  table.ranking{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px;}
  table.ranking thead tr{background:var(--navy);text-align:left;}
  table.ranking th, table.ranking td{padding:9px 10px;}
  table.ranking td.c{text-align:center;opacity:.8;}
  table.ranking td.top{color:var(--yellow);}
  table.ranking td.pts{text-align:right;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--yellow);}
  table.ranking tr{border-top:1px solid var(--line);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;}
  .modal{width:100%;max-width:320px;background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;margin-bottom:10px;}
  .modal input{width:100%;padding:10px;border-radius:10px;background:var(--navy-deep);border:1px solid var(--line);color:var(--chalk);margin-bottom:8px;outline:none;}
  .pass-wrap{position:relative;}
  .pass-wrap input{padding-right:42px;}
  .toggle-pass{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin-top:-4px;background:none;border:none;font-size:18px;cursor:pointer;padding:6px;line-height:1;}
  .pin-error{font-size:12px;color:#FF9B9B;min-height:16px;}
  .modal-actions{display:flex;gap:8px;margin-top:6px;}
  .modal-actions button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--chalk);cursor:pointer;}
  .modal-actions .btn-primary{border:none;}

  .hp-footer{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.5;background:var(--navy);padding:5px 12px;border-radius:999px;}
</style>
</head>
<body>
  <div id="root"><div class="loading">Carregando quadra...</div></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
